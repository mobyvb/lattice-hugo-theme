{{ define "main" }}
<div class="content-section">
  {{.Content}}
  <ul class="post-list">
    {{ range .Pages }}
    <li class="post-item">
      <a href="{{ .Permalink }}" class="post-link">
        <span class="post-title">{{ .Title }}</span>
        <span class="post-date">{{ .Date.Format "Jan 2, 2006" }}</span>
      </a>
    </li>
    {{ end }}
  </ul>
</div>
{{ end }}
